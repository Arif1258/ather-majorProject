name: Continuous Integration

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

jobs:
  quality-assurance:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Type Check
        run: npx tsc --noEmit
        working-directory: ./frontend

      - name: Run Tests
        run: npm run test

  build-verification:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: quality-assurance
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Test Web Build
        run: docker build -f docker/web.Dockerfile -t aether-web:test .

      - name: Test Worker Build
        run: docker build -f docker/worker.Dockerfile -t aether-worker:test .
